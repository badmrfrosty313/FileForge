[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fileforge"
version = "0.1.0"
description = "Safety-first batch file management"
requires-python = ">=3.11"
dependencies = ["PySide6==6.8.1"]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.8.4", "pyinstaller==6.11.1"]

[project.scripts]
fileforge = "fileforge.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E702"]
